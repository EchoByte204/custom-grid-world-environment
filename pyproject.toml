[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-robot-navigation-env"
version = "1.0.0"
description = "A real-world warehouse robot navigation environment"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "openenv-participant", email = "author@openenv.dev" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.4",
    "openai>=1.30.1",
    "requests>=2.32.2",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.2.0",
    "openenv-core>=0.2.0"
]

[project.scripts]
server = "server.app:main"
